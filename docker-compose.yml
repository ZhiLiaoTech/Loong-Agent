services:
  loong:
    build:
      context: .
    image: loong-agent/loong:local
    env_file:
      - path: .env
        required: false
    environment:
      LOONG_GATEWAY_HOST: 0.0.0.0
      LOONG_GATEWAY_PORT: 8787
      LOONG_SESSION_DIR: /data/sessions
      LOONG_MEMORY_DIR: /data/memory
      LOONG_CRON_JOBS: /data/cron/jobs.json
      LOONG_MODEL_CONFIG: /data/config/providers.json
      LOONG_AGENT_CONFIG: /data/config/agents.json
    ports:
      - "${LOONG_GATEWAY_PUBLISHED_PORT:-8787}:8787"
    volumes:
      - loong-data:/data
    restart: unless-stopped

volumes:
  loong-data:
